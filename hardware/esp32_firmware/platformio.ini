; FedGrid ESP32 meter — build & upload from CLI: pio run -t upload
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps = 
    iakop/LiquidCrystal_I2C_ESP32

; Upload port: set to your ESP32's serial port, e.g. /dev/cu.usbserial-* or COM3
; upload_port = /dev/cu.usbserial-0001
