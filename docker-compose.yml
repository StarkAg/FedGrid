# FedGrid — All services in Docker. One URL (http://localhost), no localhost in frontend.
# Start: docker compose up --build -d
# Stop:  docker compose down

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fedgrid-api
    environment:
      - FLASK_PORT=5001
      - FEDGRID_MODE=simulation
    volumes:
      - fedgrid_data:/app/data
    networks:
      - fedgrid
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: fedgrid-dashboard
    environment:
      - PORT=3000
    networks:
      - fedgrid
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: fedgrid-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - dashboard
    networks:
      - fedgrid
    restart: unless-stopped

networks:
  fedgrid:
    driver: bridge

volumes:
  fedgrid_data:
